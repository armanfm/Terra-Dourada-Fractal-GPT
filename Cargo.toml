[package]
name = "terra-dourada-gpt"
version = "0.1.0"
edition = "2021"
resolver = "2"

# =========================================================
# DEPENDÊNCIAS
# =========================================================
[dependencies]
crystals-dilithium = "1.0.0"
sha2 = "0.10"
warp = { version = "0.4.2", features = ["server"] }

ndarray = "0.15"
ndarray-rand = "0.14"

rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.9.0"
fastrand = "2.3.0"
bytes = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

log = "0.4.29"
instant = "0.1.13"
rayon = "1.11.0"

bincode = "1.3.3"
once_cell = "1.21.3"

chrono = "0.4.42"
base64 = "0.22.1"
hex = "0.4.3"
anyhow = "1.0.100"
lru = "0.16.2"

mimalloc = { version = "0.1.48", features = ["secure"] }

# 🔥 DEPENDÊNCIAS DO HÍBRIDO (sempre declaradas)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio   = { version = "1", features = ["full"] }

# =========================================================
# FEATURES
# =========================================================
[features]
default = []
experimental_semantic = []
hibrido = []

# =========================================================
# BINÁRIOS
# =========================================================


[[bin]]
name = "chat"
path = "src/bin/chat.rs"
required-features = ["hibrido"]
