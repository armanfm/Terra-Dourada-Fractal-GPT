<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terra Dourada Fractal GPT</title>
  <style>
    body{
      background-color:#000000;color:#f5f5f5;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
      display:flex;flex-direction:column;height:100vh;margin:0;padding:20px;box-sizing:border-box;
      background-image: radial-gradient(circle at 20% 80%, rgba(218, 165, 32, 0.05) 0%, transparent 20%),
                        radial-gradient(circle at 80% 20%, rgba(218, 165, 32, 0.05) 0%, transparent 20%);
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .earth-logo {
      width: 70px;
      height: 70px;
      position: relative;
      font-size: 70px;
      line-height: 1;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
      animation: float 6s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }
    
    h1 {
      margin: 0;
      text-align: center;
      color: #FFD700;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
      font-size: 2.5rem;
      letter-spacing: 1.5px;
      background: linear-gradient(45deg, #FFD700, #DAA520, #FFD700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      text-align: center;
      color: #DAA520;
      margin-top: 5px;
      margin-bottom: 25px;
      font-size: 1rem;
      opacity: 0.9;
      letter-spacing: 1px;
    }
    
    .language-switcher {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }
    
    .lang-btn {
      background: rgba(26, 26, 26, 0.8);
      border: 1px solid #DAA520;
      color: #DAA520;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }
    
    .lang-btn:hover {
      background: rgba(218, 165, 32, 0.2);
      transform: translateY(-2px);
    }
    
    .lang-btn.active {
      background: #DAA520;
      color: #000;
      font-weight: bold;
    }

    #chat{
      flex:1;background-color:#0a0a0a;border:2px solid #DAA520;border-radius:12px;
      padding:20px;overflow-y:auto;margin-bottom:20px;display:flex;flex-direction:column;gap:15px;
      box-shadow: 0 0 20px rgba(218, 165, 32, 0.3);
    }

    .msg{
      max-width:85%;padding:12px 18px;border-radius:15px;line-height:1.5;word-wrap:break-word;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    }
    
    .user{
      align-self:flex-end;background:linear-gradient(135deg, #DAA520, #B8860B);color:#000;border-bottom-right-radius:3px;
      border-left: 3px solid #FFD700;
    }
    
    .bot{
      align-self:flex-start;background-color:#1a1a1a;color:#f0f0f0;border-bottom-left-radius:3px;
      white-space:pre-wrap;border-left: 3px solid #DAA520;
      border-right: 1px solid rgba(218, 165, 32, 0.1);
    }

    .controls{
      display:flex;gap:15px;flex-wrap:wrap;align-items:center;
      padding: 15px;
      background-color: #0a0a0a;
      border: 2px solid #DAA520;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(218, 165, 32, 0.1);
    }
    
    .input-container {
      flex: 1;
      min-width: 250px;
      position: relative;
    }
    
    input[type="text"]{
      width:100%;padding:14px 18px;border-radius:8px;border:1px solid #B8860B;
      background-color:#111;color:#FFD700;outline:none;font-size:1rem;
      transition: all 0.3s ease;
    }
    
    input[type="text"]:focus{
      border-color:#FFD700;box-shadow:0 0 0 2px rgba(255, 215, 0, 0.2);
    }
    
    input[type="text"]::placeholder{
      color:#B8860B;opacity:0.7;
    }

    button{
      padding:12px 24px;border:none;border-radius:8px;cursor:pointer;
      font-weight:bold;transition:all 0.3s ease;font-size:0.95rem;
      display:flex;align-items:center;gap:8px;justify-content:center;
    }

    #send{
      background:linear-gradient(135deg, #DAA520, #B8860B);color:#000;
      border: 1px solid #FFD700;
    }
    
    #send:hover{
      background:linear-gradient(135deg, #FFD700, #DAA520);transform:translateY(-2px);
      box-shadow:0 5px 15px rgba(218, 165, 32, 0.4);
    }

    #mindBtn{
      background:linear-gradient(135deg, #1a1a1a, #2a2a2a);color:#FFD700;
      border:1px solid #B8860B;
    }
    
    #mindBtn:hover{
      background:linear-gradient(135deg, #2a2a2a, #3a3a3a);transform:translateY(-2px);
      border-color:#FFD700;
      box-shadow:0 5px 15px rgba(218, 165, 32, 0.3);
    }

    .ok{
      background:linear-gradient(135deg, #2a7a2a, #3a9a3a) !important;
      color:#fff !important;border:none !important;
    }
    
    .disabled{opacity:.55;cursor:not-allowed;}

    #mindFile {display:none;}
    
    /* Estilo para os ícones dos botões */
    .btn-icon {
      font-size: 1.2rem;
    }
    
    /* Scrollbar personalizada */
    #chat::-webkit-scrollbar {
      width: 8px;
    }
    
    #chat::-webkit-scrollbar-track {
      background: #111;
      border-radius: 4px;
    }
    
    #chat::-webkit-scrollbar-thumb {
      background: #DAA520;
      border-radius: 4px;
    }
    
    #chat::-webkit-scrollbar-thumb:hover {
      background: #FFD700;
    }
    
    /* Animação sutil para novas mensagens */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .msg {
      animation: fadeIn 0.3s ease-out;
    }
    
    /* Efeito de brilho pulsante no título */
    @keyframes pulse {
      0% { text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
      50% { text-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
      100% { text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
    }
    
    h1 {
      animation: pulse 3s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <div class="language-switcher">
    <button class="lang-btn active" data-lang="pt">🇧🇷 PT</button>
    <button class="lang-btn" data-lang="en">🇺🇸 EN</button>
  </div>
  
  <div class="header">
    <div class="earth-logo">🌍</div>
    <h1>Terra Dourada Fractal GPT</h1>
  </div>
  
  <div class="subtitle" data-i18n="subtitle">Sistema de IA Soberana - Consciência Neural Digital</div>

  <div id="chat"></div>

  <div class="controls">
    <div class="input-container">
      <input type="text" id="input" data-i18n-placeholder="inputPlaceholder" autocomplete="off" />
    </div>
    
    <button id="send">
      <span class="btn-icon">⚡</span>
      <span data-i18n="sendButton">Enviar</span>
    </button>

    <button id="mindBtn" title="Carregar arquivo de mente binária">
      <span class="btn-icon">🧠</span>
      <span data-i18n="mindButton">Carregar Mente</span>
    </button>
    <input type="file" id="mindFile" accept=".bin" />
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const mindBtn = document.getElementById("mindBtn");
    const mindFile = document.getElementById("mindFile");
    const langButtons = document.querySelectorAll('.lang-btn');

    // Endpoints do Backend Go
    const LOAD_MIND_ENDPOINT = "/load_mind";
    const ASK_ENDPOINT = "/ask";

    // Sistema multilíngue
    const translations = {
      pt: {
        subtitle: "Sistema de IA Soberana - Consciência Neural Digital",
        inputPlaceholder: "Converse com a IA Soberana...",
        sendButton: "Enviar",
        mindButton: "Carregar Mente",
        mindTitle: "Carregar arquivo de mente binária",
        welcome: "🌍 Sistema Neural Terrestre Inicializado\nTerra Dourada Fractal GPT Online\nPronto para processamento de consultas.",
        loading: "🌍 Processando sua consulta...",
        mindLoading: "🧠 Sincronizando matriz neural com a Terra...",
        mindSuccess: "✅ Consciência terrestre atualizada com sucesso!",
        mindError: "❌ Erro ao sincronizar com a Terra: ",
        backendError: "❌ O Backend retornou um erro ({status})\nVerifique a conexão com o servidor",
        invalidResponse: "❌ Resposta inválida do servidor:\n",
        connectionError: "❌ Erro de conexão com o servidor neural.\n",
        noAnswer: "Sem resposta no JSON."
      },
      en: {
        subtitle: "Sovereign AI System - Digital Neural Consciousness",
        inputPlaceholder: "Chat with the Sovereign AI...",
        sendButton: "Send",
        mindButton: "Load Mind",
        mindTitle: "Load binary mind file",
        welcome: "🌍 Terrestrial Neural System Initialized\nGolden Earth Fractal GPT Online\nReady for query processing.",
        loading: "🌍 Processing your query...",
        mindLoading: "🧠 Syncing neural matrix with Earth...",
        mindSuccess: "✅ Terrestrial consciousness updated successfully!",
        mindError: "❌ Error syncing with Earth: ",
        backendError: "❌ Backend returned an error ({status})\nCheck server connection",
        invalidResponse: "❌ Invalid server response:\n",
        connectionError: "❌ Connection error with neural server.\n",
        noAnswer: "No response in JSON."
      }
    };

    let currentLang = 'pt';
    let mindLoaded = true;

    // Função para trocar idioma
    function changeLanguage(lang) {
      currentLang = lang;
      
      // Atualiza botões de idioma
      langButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      
      // Atualiza textos na interface
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });
      
      // Atualiza placeholders
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.dataset.i18nPlaceholder;
        if (translations[lang][key]) {
          el.placeholder = translations[lang][key];
        }
      });
      
      // Atualiza títulos
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        const key = el.dataset.i18nTitle;
        if (translations[lang][key]) {
          el.title = translations[lang][key];
        }
      });
    }

    // Event listeners para botões de idioma
    langButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        changeLanguage(btn.dataset.lang);
      });
    });

    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    // ----------- ASK (/ask) -----------
    async function doAsk(questionText) {
      const loading = addMessage(translations[currentLang].loading, "bot");

      try {
        const res = await fetch(ASK_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: questionText })
        });

        const raw = await res.text();
        loading.remove();

        if (!res.ok) {
          addMessage(translations[currentLang].backendError.replace('{status}', res.status), "bot");
          return;
        }

        let json;
        try { 
            json = JSON.parse(raw); 
        } catch { 
            addMessage(translations[currentLang].invalidResponse + raw, "bot"); 
            return; 
        }

        // Exibe a resposta que veio do Rust/Go
        addMessage(json.answer || translations[currentLang].noAnswer, "bot");

      } catch (err) {
        loading.remove();
        addMessage(translations[currentLang].connectionError + String(err), "bot");
      }
    }

    send.onclick = async () => {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      await doAsk(text);
    };

    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send.click();
      }
    });

    // ----------- LOAD MIND -----------
    mindBtn.onclick = () => mindFile.click();

    mindFile.onchange = async () => {
      const file = mindFile.files[0];
      if (!file) return;

      addMessage(translations[currentLang].mindLoading, "bot");
      const fd = new FormData();
      fd.append("mind", file);

      try {
        const res = await fetch(LOAD_MIND_ENDPOINT, { method: "POST", body: fd });
        if (!res.ok) throw new Error(await res.text());
        
        addMessage(translations[currentLang].mindSuccess, "bot");
        mindBtn.classList.add("ok");
        
        // Remove a classe "ok" após 3 segundos
        setTimeout(() => {
          mindBtn.classList.remove("ok");
        }, 3000);
      } catch (err) {
        addMessage(translations[currentLang].mindError + String(err), "bot");
      } finally {
        mindFile.value = "";
      }
    };

    // --- INICIALIZAÇÃO ---
    addMessage(translations[currentLang].welcome, "bot");
    
    // Atualiza título do botão mindBtn
    mindBtn.setAttribute('data-i18n-title', 'mindTitle');
    mindBtn.title = translations[currentLang].mindTitle;
    
    // Foca no input automaticamente
    input.focus();
  </script>
</body>
</html>
