<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Terra Dourada Brands</title>
  <style>
    :root{
      --bg:#0b0f14;--card:#101826;--text:#e7eef7;--muted:#9bb0c4;
      --accent:#6ee7b7;--danger:#fb7185;--line:rgba(255,255,255,.08);
      --field:#0c1420;--fieldLine:rgba(255,255,255,.12);
      --btnBg:rgba(110,231,183,.12);--btnLine:rgba(110,231,183,.35);
      --warn:#fbbf24;
    }
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text);}
    .wrap{max-width:980px;margin:0 auto;padding:18px;}
    h1{margin:0 0 12px;font-size:22px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
    label{font-size:12px;color:var(--muted);display:block;margin:0 0 6px}
    input[type="text"],input[type="number"],input[type="password"],select{
      background:var(--field);border:1px solid var(--fieldLine);color:var(--text);
      border-radius:12px;padding:10px 12px;outline:none;box-sizing:border-box;
      min-width:280px
    }
    input[type="number"]{min-width:120px}
    input[type="password"]{min-width:360px}
    select{min-width:220px}
    button{
      background:var(--btnBg);border:1px solid var(--btnLine);color:var(--text);
      padding:10px 12px;border-radius:12px;cursor:pointer
    }
    button:disabled{opacity:.5;cursor:not-allowed}
    .muted{color:var(--muted);font-size:13px}
    .ok{color:var(--accent)}
    .bad{color:var(--danger)}
    .warn{color:var(--warn)}
    pre{white-space:pre-wrap;background:var(--field);border:1px solid var(--line);padding:12px;border-radius:12px;margin:10px 0}
    .pill{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid var(--fieldLine);font-size:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr;gap:10px}
    @media (min-width:900px){ .grid{grid-template-columns:1fr 1fr} }

    .checkline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
    .checkline input{transform:scale(1.15);accent-color:var(--accent)}
    .small{font-size:12px;color:var(--muted)}
    
    .language-toggle{position:absolute;top:18px;right:18px;display:flex;gap:8px;background:var(--card);padding:6px;border-radius:12px;border:1px solid var(--line)}
    .lang-btn{padding:4px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:13px}
    .lang-btn.active{background:var(--btnBg);color:var(--accent)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="language-toggle">
      <div class="lang-btn active" data-lang="pt">PT</div>
      <div class="lang-btn" data-lang="en">EN</div>
    </div>
    
    <h1>Terra Dourada Brands</h1>

    <div class="card">
      <div class="row">
        <div>
          <label>1) Carregar marcas.bin (TERRAMIN)</label>
          <input id="file" type="file" accept=".bin"/>
        </div>
        <div>
          <button id="btnLoad">Carregar base</button>
        </div>
        <span id="dbStatus" class="pill">Base: não carregada</span>
      </div>
      <div id="loadMsg" class="muted" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <label>2) Marca para checar</label>
          <input id="brand" type="text"/>
        </div>
        <div>
          <label>Top N (engine)</label>
          <input id="topn" type="number" min="1" max="25" value="10"/>
        </div>
        <div>
          <button id="btnCheck">Checar</button>
        </div>
      </div>

      <div id="checkMsg" class="muted" style="margin-top:10px"></div>
      <pre id="out"></pre>
    </div>

    <div class="card">
      <div class="grid">
        <div>
          <label>3) Segmento (escopo de mercado)</label>
          <input id="segment" type="text"/>
          <div class="small" style="margin-top:6px">Ex.: alimentício, cosméticos, farmacêutico, tecnologia</div>
        </div>

        <div>
          <label>4) Revisão semântica (Gemini) — chave fica só no navegador</label>
          <input id="apiKey" type="password"/>
          <div class="checkline">
            <label class="small" style="display:flex;gap:8px;align-items:center;margin:0">
              <input id="rememberKey" type="checkbox"/>
              <span class="remember-text">salvar chave nesta aba (sessionStorage)</span>
            </label>

            <label class="small" style="display:flex;gap:8px;align-items:center;margin:0">
              <input id="autoReview" type="checkbox" checked/>
              <span class="auto-text">revisar automaticamente após "Checar"</span>
            </label>
          </div>
        </div>
      </div>

      <div class="row" style="margin-top:12px">
        <div>
          <label>Modelo</label>
          <select id="model">
            <option value="gemini-3-flash-preview">gemini-3-flash-preview</option>
            <option value="gemini-3-pro-preview">gemini-3-pro-preview</option>
          </select>
        </div>

        <div>
          <label>Temperatura</label>
          <input id="temperature" type="number" step="0.1" min="0" max="2" value="0.1"/>
        </div>

        <div>
          <label>Max output tokens</label>
          <input id="maxTokens" type="number" step="1" min="32" max="8192" value="512"/>
        </div>

        <div>
          <label>Idioma da revisão</label>
          <select id="reviewLang">
            <option value="pt" selected>Português (Brasil)</option>
            <option value="en">English</option>
          </select>
        </div>

        <div>
          <button id="btnReview">Revisar (LLM)</button>
        </div>
      </div>

      <div id="llmMsg" class="muted" style="margin-top:10px"></div>
      <pre id="llmOut"></pre>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  
  // Language management - SIMPLE VERSION
  let currentLang = 'pt'; // default to Portuguese
  
  function setLanguage(lang) {
    currentLang = lang;
    
    // Update active button
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.remove('active');
      if (btn.getAttribute('data-lang') === lang) {
        btn.classList.add('active');
      }
    });
    
    // Simple translation for key texts
    const translations = {
      pt: {
        'btnLoad': 'Carregar base',
        'btnCheck': 'Checar',
        'btnReview': 'Revisar (LLM)',
        'dbStatus': 'Base: não carregada',
        'rememberText': 'salvar chave nesta aba (sessionStorage)',
        'autoText': 'revisar automaticamente após "Checar"'
      },
      en: {
        'btnLoad': 'Load database',
        'btnCheck': 'Check',
        'btnReview': 'Review (LLM)',
        'dbStatus': 'Database: not loaded',
        'rememberText': 'save key in this tab (sessionStorage)',
        'autoText': 'auto-review after "Check"'
      }
    };
    
    // Apply translations to buttons
    if (translations[lang]['btnLoad']) $('btnLoad').textContent = translations[lang]['btnLoad'];
    if (translations[lang]['btnCheck']) $('btnCheck').textContent = translations[lang]['btnCheck'];
    if (translations[lang]['btnReview']) $('btnReview').textContent = translations[lang]['btnReview'];
    if (translations[lang]['dbStatus']) $('dbStatus').textContent = translations[lang]['dbStatus'];
    
    // Apply translations to checkbox labels
    document.querySelectorAll('.remember-text').forEach(el => {
      el.textContent = translations[lang]['rememberText'];
    });
    document.querySelectorAll('.auto-text').forEach(el => {
      el.textContent = translations[lang]['autoText'];
    });
  }
  
  // Language toggle buttons
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const lang = btn.getAttribute('data-lang');
      setLanguage(lang);
    });
  });

  function pct(x){
    if (typeof x !== "number" || !isFinite(x)) return "";
    return x.toFixed(2) + "%";
  }

  function setText(el, txt, cls){
    el.className = cls || "";
    el.textContent = txt;
  }

  function loadKeyFromSession(){
    const k = sessionStorage.getItem("td_gemini_key");
    if (k) {
      $("apiKey").value = k;
      $("rememberKey").checked = true;
    }
  }

  function saveOrClearKey(){
    const v = ($("apiKey").value || "").trim();
    if ($("rememberKey").checked && v) {
      sessionStorage.setItem("td_gemini_key", v);
    } else {
      sessionStorage.removeItem("td_gemini_key");
    }
  }

  // RESTORED ORIGINAL EVENT HANDLERS
  $("rememberKey").addEventListener("change", function() {
    const v = ($("apiKey").value || "").trim();
    if (this.checked && v) {
      sessionStorage.setItem("td_gemini_key", v);
    } else {
      sessionStorage.removeItem("td_gemini_key");
    }
  });
  
  $("apiKey").addEventListener("input", function() {
    if ($("rememberKey").checked) {
      const v = ($("apiKey").value || "").trim();
      if (v) {
        sessionStorage.setItem("td_gemini_key", v);
      } else {
        sessionStorage.removeItem("td_gemini_key");
      }
    }
  });

  async function loadDB(){
    const f = $("file").files && $("file").files[0];
    if (!f){
      setText($("loadMsg"), currentLang === 'pt' ? "Selecione um arquivo .bin." : "Select a .bin file.", "bad");
      return;
    }

    $("btnLoad").disabled = true;
    setText($("loadMsg"), currentLang === 'pt' ? "Carregando..." : "Loading...", "muted");

    try{
      const fd = new FormData();
      fd.append("marcas", f);

      const res = await fetch("/load_marcas", { method: "POST", body: fd });
      const js = await res.json().catch(() => null);

      if (!res.ok || !js || !js.ok){
        const err = (js && js.error) ? js.error : ("HTTP " + res.status);
        setText($("loadMsg"), (currentLang === 'pt' ? "Falhou: " : "Failed: ") + err, "bad");
        setText($("dbStatus"), currentLang === 'pt' ? "Base: não carregada" : "Database: not loaded", "pill");
        return;
      }

      setText($("loadMsg"), 
        currentLang === 'pt' 
          ? `OK. Total: ${js.total_marcas} | decode: ${js.decode_mode}` 
          : `OK. Total: ${js.total_marcas} | decode: ${js.decode_mode}`, 
        "ok"
      );
      setText($("dbStatus"), 
        currentLang === 'pt' 
          ? `Base: carregada (${js.total_marcas})` 
          : `Database: loaded (${js.total_marcas})`, 
        "pill"
      );
    }catch(e){
      setText($("loadMsg"), (currentLang === 'pt' ? "Falhou: " : "Failed: ") + e.message, "bad");
      setText($("dbStatus"), currentLang === 'pt' ? "Base: não carregada" : "Database: not loaded", "pill");
    }finally{
      $("btnLoad").disabled = false;
    }
  }

  // -------------------------------
  // LLM Prompt (BRASIL - LPI)
  // -------------------------------
  function buildPromptWinner_BR(reqBrand, best, segment, lang){
    const language = (lang === "pt") ? "Portuguese (Brazil)" : "English";
    const seg = (segment && String(segment).trim()) ? String(segment).trim() : currentLang === 'pt' ? "(não informado)" : "(not informed)";

    const bName = String(best?.nome ?? "");
    const bBytes = Number(best?.bytes_pct ?? 0).toFixed(2);
    const bSha = Number(best?.sha256_pct ?? 0).toFixed(2);
    const bWin = Number(best?.winner_pct ?? Math.max(best?.bytes_pct ?? 0, best?.sha256_pct ?? 0)).toFixed(2);

    return (
`You are Terra Dourada Brands — Semantic Review for BRAZIL (LPI 9.279/96). Not legal advice.

LANGUAGE: ${language}

CONSTRAINTS:
- Decide by likelihood of confusion/association (trade origin) in the relevant market.
- Evaluate as a whole (overall impression), not only one token.
- Distinctive elements weigh more; generic/common terms weigh less.
- Consider market proximity using the SEGMENT scope. If segment is missing, lower confidence.
- Consider phonetics (pronunciation, rhythm, syllables, nicknames/transliteration).
- Consider visual similarity (shared roots, structure, punctuation, spacing).
- Consider semantics (same idea/category can raise association).
- Do NOT claim INPI status, owner, class, fame, or "well-known" unless explicitly provided.

YOU MUST EXPLAIN:
- If REJECTED: name the 1–2 dominant collision reasons (e.g., phonetic collision + market proximity).
- If APPROVED: name what makes it distinctive (dominant differences) and why confusion is unlikely.
- Never rely only on percentages. Use them only as a supporting signal.

OUTPUT (max 140 words, no fluff):
DECISION: APPROVED | REJECTED | GRAY_ZONE
RISK: LOW | MEDIUM | HIGH
CONFIDENCE: 0-100

WHY (3–6 bullets, each bullet must start with one tag):
[PHONETIC] ...
[VISUAL] ...
[SEMANTIC] ...
[MARKET] ...
[DISTINCTIVENESS] ...

WHAT WOULD CHANGE THE DECISION (1–3 bullets):
- ...

INPUT:
SEGMENT: ${seg}
REQUESTED: ${reqBrand}

BEST_MATCH:
NAME: ${bName}
BYTES_PCT: ${bBytes}
SHA256_PCT: ${bSha}
WINNER_PCT: ${bWin}`
    );
  }

  async function callGemini(apiKey, model, prompt, temperature, maxTokens){
    const url =
      "https://generativelanguage.googleapis.com/v1beta/models/" +
      encodeURIComponent(model) +
      ":generateContent?key=" +
      encodeURIComponent(apiKey);

    const payload = {
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: {
        temperature: Number(temperature),
        maxOutputTokens: Number(maxTokens)
      }
    };

    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const json = await res.json().catch(() => null);
    const text =
      json &&
      json.candidates &&
      json.candidates[0] &&
      json.candidates[0].content &&
      json.candidates[0].content.parts
        ? json.candidates[0].content.parts.map(p => p.text || "").join("")
        : "";

    if (!res.ok){
      const msg = (json && json.error && json.error.message) ? json.error.message : ("HTTP " + res.status);
      throw new Error(msg);
    }

    return (text || "").trim();
  }

  // guarda o último report do engine pra botão "Revisar (LLM)"
  let lastEngineReport = null;

  async function runLLMReview(rep){
    $("llmOut").textContent = "";
    lastEngineReport = rep;

    const apiKey = ($("apiKey").value || "").trim();
    if (!apiKey){
      setText($("llmMsg"), currentLang === 'pt' 
        ? "Informe a Gemini API Key para fazer a revisão." 
        : "Provide Gemini API Key to perform review.", "warn");
      return;
    }
    saveOrClearKey();

    const best = rep && rep.best;
    if (!best){
      setText($("llmMsg"), currentLang === 'pt' 
        ? "Sem best_match no report do engine." 
        : "No best_match in engine report.", "bad");
      return;
    }

    const seg = ($("segment").value || "").trim();
    const lang = $("reviewLang").value;

    const prompt = buildPromptWinner_BR(rep.query, best, seg, lang);

    $("btnReview").disabled = true;
    setText($("llmMsg"), currentLang === 'pt' 
      ? "LLM revisando o vencedor e justificando..." 
      : "LLM reviewing winner and justifying...", "muted");

    try{
      const out = await callGemini(
        apiKey,
        $("model").value,
        prompt,
        $("temperature").value,
        $("maxTokens").value
      );

      if (!out){
        setText($("llmMsg"), currentLang === 'pt' 
          ? "LLM retornou resposta vazia." 
          : "LLM returned empty response.", "warn");
        return;
      }

      $("llmOut").textContent = out;
      setText($("llmMsg"), currentLang === 'pt' 
        ? "OK. Revisão concluída." 
        : "OK. Review completed.", "ok");
    }catch(e){
      setText($("llmMsg"), (currentLang === 'pt' ? "Falhou: " : "Failed: ") + e.message, "bad");
    }finally{
      $("btnReview").disabled = false;
    }
  }

  async function checkBrand(){
    const brand = ($("brand").value || "").trim();
    const topn = parseInt($("topn").value || "10", 10);

    if (!brand){
      setText($("checkMsg"), currentLang === 'pt' ? "Digite uma marca." : "Enter a brand.", "bad");
      return;
    }

    $("btnCheck").disabled = true;
    setText($("checkMsg"), currentLang === 'pt' ? "Consultando..." : "Checking...", "muted");
    $("out").textContent = "";

    try{
      const res = await fetch("/check_brand", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ brand: brand, top_n: topn })
      });

      const js = await res.json().catch(() => null);
      if (!res.ok || !js || js.mode !== "ok"){
        const err = (js && js.error) ? js.error : ("HTTP " + res.status);
        setText($("checkMsg"), (currentLang === 'pt' ? "Falhou: " : "Failed: ") + err, "bad");
        return;
      }

      const rep = js.report;
      lastEngineReport = rep;

      const best = rep && rep.best;
      const top = rep && rep.top ? rep.top : [];

      let text = "";
      text += "Query: " + rep.query + "\n";
      text += "Total: " + rep.total_marcas + " | decode: " + rep.decode_mode + "\n\n";

      if (best){
        text += "BEST MATCH\n";
        text += "Name: " + best.nome + "\n";
        text += "Bytes: " + pct(best.bytes_pct) + "\n";
        text += "SHA256: " + pct(best.sha256_pct) + "\n";
        text += "Winner: " + pct(best.winner_pct) + "\n";
        text += "Hash(name): " + (best.sha256_hex || "") + "\n\n";
      }

      if (top.length){
        text += "TOP " + top.length + "\n";
        top.forEach((c, i) => {
          text += (i+1) + ") " + c.nome +
                  " | W " + pct(c.winner_pct) +
                  " | B " + pct(c.bytes_pct) +
                  " | S " + pct(c.sha256_pct) + "\n";
        });
      }

      $("out").textContent = text;
      setText($("checkMsg"), rep.message || (currentLang === 'pt' ? "OK" : "OK"), "ok");

      // auto-review
      if ($("autoReview").checked){
        const k = ($("apiKey").value || "").trim();
        if (k){
          await runLLMReview(rep);
        } else {
          setText($("llmMsg"), 
            currentLang === 'pt' 
              ? "Similarity ok. Falta a Gemini API Key para a revisão semântica." 
              : "Similarity ok. Missing Gemini API Key for semantic review.", 
            "warn"
          );
          $("llmOut").textContent = "";
        }
      }

    }catch(e){
      setText($("checkMsg"), (currentLang === 'pt' ? "Falhou: " : "Failed: ") + e.message, "bad");
    }finally{
      $("btnCheck").disabled = false;
    }
  }

  $("btnLoad").addEventListener("click", loadDB);
  $("btnCheck").addEventListener("click", checkBrand);

  $("btnReview").addEventListener("click", async () => {
    if (!lastEngineReport){
      setText($("llmMsg"), 
        currentLang === 'pt' 
          ? "Faça um 'Checar' primeiro para ter um vencedor." 
          : "Perform a 'Check' first to have a winner.", 
        "warn"
      );
      return;
    }
    await runLLMReview(lastEngineReport);
  });

  loadKeyFromSession();
  // Initialize with Portuguese as default
  setLanguage('pt');
</script>
</body>
</html>
