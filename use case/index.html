<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terra Dourada Brands</title>
  <style>
    body{
      background-color:#000000;color:#f5f5f5;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
      display:flex;flex-direction:column;height:100vh;margin:0;padding:20px;box-sizing:border-box;
      background-image: radial-gradient(circle at 20% 80%, rgba(218, 165, 32, 0.05) 0%, transparent 20%),
                        radial-gradient(circle at 80% 20%, rgba(218, 165, 32, 0.05) 0%, transparent 20%);
    }

    .language-switcher {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 100;
      align-items: center;
      flex-wrap: wrap;
    }

    .lang-btn {
      background: rgba(26, 26, 26, 0.8);
      border: 1px solid #DAA520;
      color: #DAA520;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
      user-select: none;
      display:flex;
      align-items:center;
      gap:8px;
      justify-content:center;
    }
    .lang-btn.active { background: #DAA520; color: #000; font-weight: bold; }

    .header { display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:20px; }
    h1 { margin:0; text-align:center; color:#FFD700; font-size:2.2rem; letter-spacing:1.2px; }

    .subtitle { text-align:center; color:#DAA520; margin-top:5px; margin-bottom:25px; font-size:1rem; opacity:0.9; }

    #chat{
      flex:1;background-color:#0a0a0a;border:2px solid #DAA520;border-radius:12px;
      padding:20px;overflow-y:auto;margin-bottom:20px;display:flex;flex-direction:column;gap:15px;
      box-shadow: 0 0 20px rgba(218, 165, 32, 0.3);
    }

    .msg{
      max-width:85%;padding:12px 18px;border-radius:15px;line-height:1.5;word-wrap:break-word;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      white-space:pre-wrap;
    }
    .user{ align-self:flex-end;background:linear-gradient(135deg, #DAA520, #B8860B);color:#000;border-bottom-right-radius:3px; }
    .bot{ align-self:flex-start;background-color:#1a1a1a;color:#f0f0f0;border-bottom-left-radius:3px; }

    .controls{
      display:flex;gap:15px;flex-wrap:wrap;align-items:center;
      padding: 15px;
      background-color: #0a0a0a;
      border: 2px solid #DAA520;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(218, 165, 32, 0.1);
    }

    .input-container { flex:1; min-width:250px; }
    input[type="text"], input[type="password"], input[type="number"], select{
      width:100%;padding:14px 18px;border-radius:8px;border:1px solid #B8860B;
      background-color:#111;color:#FFD700;outline:none;font-size:1rem; box-sizing:border-box;
    }

    button{
      padding:12px 24px;border:none;border-radius:8px;cursor:pointer;
      font-weight:bold;transition:all 0.3s ease;font-size:0.95rem;
      display:flex;align-items:center;gap:8px;justify-content:center;
      user-select: none;
    }

    #send{ background:linear-gradient(135deg, #DAA520, #B8860B);color:#000; border:1px solid #FFD700; }
    #dbBtn{ background:linear-gradient(135deg, #1a1a1a, #2a2a2a);color:#FFD700; border:1px solid #B8860B; }
    #toggleKeyBtn{ background:linear-gradient(135deg, #1a1a1a, #2a2a2a);color:#FFD700; border:1px solid #B8860B; padding:12px 18px; }
    .ok{ background:linear-gradient(135deg, #2a7a2a, #3a9a3a) !important; color:#fff !important; border:none !important; }
    #dbFile {display:none;}

    .config-row{
      display:flex; gap:12px; flex-wrap:wrap; align-items:center; width:100%;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(218,165,32,0.25);
    }
    .cfg{ min-width: 220px; flex: 1 1 220px; }
    .cfg small{ display:block; color:#DAA520; opacity:0.9; margin: 0 0 6px 2px; letter-spacing: 0.5px; }
    .cfg-check{ display:flex; align-items:center; gap:10px; min-width: 220px; flex: 1 1 220px; color:#DAA520; }
    .cfg-check input{ width:auto; transform: scale(1.2); accent-color:#DAA520; }

    .mini { min-width: 160px; flex: 0 1 160px; }
  </style>
</head>
<body>
  <div class="language-switcher">
    <button class="lang-btn active" data-lang="pt">🇧🇷 PT</button>
    <button class="lang-btn" data-lang="en">🇺🇸 EN</button>
  </div>

  <div class="header">
    <h1>Terra Dourada Brands</h1>
  </div>

  <div class="subtitle" data-i18n="subtitle">Verificação de similaridade + decisão (Gemini decide)</div>

  <div id="chat"></div>

  <div class="controls">
    <div class="input-container">
      <input type="text" id="input" data-i18n-placeholder="inputPlaceholder" autocomplete="off" />
    </div>

    <button id="send">⚡ <span data-i18n="sendButton">Checar</span></button>

    <button id="dbBtn" title="Carregar marcas.bin">
      🗃️ <span data-i18n="dbButton">Carregar marcas.bin</span>
    </button>
    <input type="file" id="dbFile" accept=".bin,.txt" />

    <button id="toggleKeyBtn" title="Mostrar/ocultar chave">
      🔑 <span data-i18n="keyButton">Chave</span>
    </button>

    <div class="config-row" id="configRow" style="display:none;">
      <div class="cfg">
        <small data-i18n="apiKeyLabel">Gemini API Key (fica só no navegador)</small>
        <input id="apiKey" type="password" data-i18n-placeholder="apiKeyPlaceholder" autocomplete="off" />
      </div>

      <div class="cfg">
        <small data-i18n="modelLabel">Modelo</small>
        <select id="model">
          <option value="gemini-3-flash-preview">gemini-3-flash-preview</option>
          <option value="gemini-3-pro-preview">gemini-3-pro-preview</option>
        </select>
      </div>

      <div class="cfg mini">
        <small data-i18n="tempLabel">Temperatura</small>
        <input id="temperature" type="number" step="0.1" min="0" max="2" value="0.4" />
      </div>

      <div class="cfg mini">
        <small data-i18n="maxTokensLabel">Max output tokens</small>
        <input id="maxTokens" type="number" step="1" min="1" max="8192" value="2048" />
      </div>

      <div class="cfg mini">
        <small>Top N (engine)</small>
        <input id="topN" type="number" step="1" min="1" max="500" value="50" />
      </div>

      <div class="cfg-check">
        <input id="rememberKey" type="checkbox" />
        <span data-i18n="rememberKey">Salvar chave nesta aba (sessionStorage)</span>
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const dbBtn = document.getElementById("dbBtn");
    const dbFile = document.getElementById("dbFile");
    const langButtons = document.querySelectorAll('.lang-btn[data-lang]');

    const toggleKeyBtn = document.getElementById("toggleKeyBtn");
    const configRow = document.getElementById("configRow");
    const apiKeyInput = document.getElementById("apiKey");
    const rememberKey = document.getElementById("rememberKey");
    const modelSel = document.getElementById("model");
    const tempInput = document.getElementById("temperature");
    const maxTokensInput = document.getElementById("maxTokens");
    const topNInput = document.getElementById("topN");

    const LOAD_DB_ENDPOINT = "/load_marcas";
    const CHECK_ENDPOINT = "/check_brand";

    const translations = {
      pt: {
        subtitle: "Verificação de similaridade + decisão (Gemini decide)",
        inputPlaceholder: "Digite a marca para checar...",
        sendButton: "Checar",
        dbButton: "Carregar marcas.bin",
        keyButton: "Chave",
        apiKeyLabel: "Gemini API Key (fica só no navegador)",
        apiKeyPlaceholder: "Cole sua Gemini API Key aqui",
        modelLabel: "Modelo",
        tempLabel: "Temperatura",
        maxTokensLabel: "Max output tokens",
        rememberKey: "Salvar chave nesta aba (sessionStorage)",
        welcome: "🌍 Terra Dourada Brands online.\nCarregue marcas.bin e cheque uma marca.",
        dbLoading: "🗃️ Carregando marcas...",
        dbSuccess: "✅ Base carregada.",
        dbError: "❌ Erro ao carregar base: ",
        checking: "🔎 Calculando similaridade (engine)...",
        noKeyTitle: "⚠️ Similaridade calculada.",
        noKeyHint: "Informe a chave Gemini para obter decisão e explicação.",
        noKeyBest: "Melhor match:",
        noKeyScore: "Similaridade (combinada):",
        geminiCalling: "⚡ Gemini decidindo e explicando...",
        geminiFail: "❌ Falha ao chamar Gemini.\n",
        badServer: "❌ Resposta inválida do servidor.",
        engineFail: "❌ Falha no engine.",
      },
      en: {
        subtitle: "Similarity check + decision (Gemini decides)",
        inputPlaceholder: "Type a brand to check...",
        sendButton: "Check",
        dbButton: "Load marcas.bin",
        keyButton: "Key",
        apiKeyLabel: "Gemini API Key (stays only in the browser)",
        apiKeyPlaceholder: "Paste your Gemini API Key here",
        modelLabel: "Model",
        tempLabel: "Temperature",
        maxTokensLabel: "Max output tokens",
        rememberKey: "Save key in this tab (sessionStorage)",
        welcome: "🌍 Terra Dourada Brands online.\nLoad marcas.bin and check a brand.",
        dbLoading: "🗃️ Loading database...",
        dbSuccess: "✅ Database loaded.",
        dbError: "❌ Error loading database: ",
        checking: "🔎 Calculating similarity (engine)...",
        noKeyTitle: "⚠️ Similarity computed.",
        noKeyHint: "Provide a Gemini key to get decision and explanation.",
        noKeyBest: "Best match:",
        noKeyScore: "Similarity (combined):",
        geminiCalling: "⚡ Gemini deciding and explaining...",
        geminiFail: "❌ Failed to call Gemini.\n",
        badServer: "❌ Invalid server response.",
        engineFail: "❌ Engine failure.",
      }
    };

    let currentLang = 'pt';
    function tr(key){ return (translations[currentLang] && translations[currentLang][key]) ? translations[currentLang][key] : key; }

    function changeLanguage(lang){
      currentLang = lang;
      langButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.dataset.i18n;
        if (translations[lang][k]) el.textContent = translations[lang][k];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const k = el.dataset.i18nPlaceholder;
        if (translations[lang][k]) el.placeholder = translations[lang][k];
      });
    }
    langButtons.forEach(btn => btn.addEventListener('click', () => changeLanguage(btn.dataset.lang)));

    function addMessage(text, cls){
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text; // ✅ sempre textContent (nada de HTML injetado)
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function loadKeyFromSession(){
      const k = sessionStorage.getItem("td_gemini_key");
      if (k) {
        apiKeyInput.value = k;
        rememberKey.checked = true;
      }
    }

    function saveOrClearKey(){
      if (rememberKey.checked && apiKeyInput.value.trim()) {
        sessionStorage.setItem("td_gemini_key", apiKeyInput.value.trim());
      } else {
        sessionStorage.removeItem("td_gemini_key");
      }
    }
    rememberKey.addEventListener("change", saveOrClearKey);
    apiKeyInput.addEventListener("input", () => { if (rememberKey.checked) saveOrClearKey(); });

    // ✅ PROMPT: SEM REFERÊNCIA A PERCENTUAL FIXO - APENAS REGRAS GERAIS
    function buildPromptBrandsDecision(userBrand, reportJsonText){
      return (
        "You are Terra Dourada Brands.\n\n" +

        "Decision policy:\n" +
        "- Similarity below a certain threshold usually indicates sufficient distinction and may be APPROVED without concern.\n" +
        "- Similarity in a moderate range is a gray zone and REQUIRES qualitative evaluation.\n" +
        "- High similarity normally indicates a direct collision and should be REJECTED, unless there is a very strong semantic divergence.\n\n" +

        "Evaluation criteria (in the gray zone):\n" +
        "- Phonetic similarity (how it sounds when spoken).\n" +
        "- Visual similarity (how it looks written).\n" +
        "- Semantic meaning and concept (are the ideas clearly different or opposed?).\n" +
        "- Distinctiveness of the differing elements.\n" +
        "- Likelihood of consumer confusion or association.\n\n" +

        "Important:\n" +
        "- Percentages are indicators, not automatic decisions.\n" +
        "- A shared generic term must NOT be treated as dominant by itself.\n" +
        "- Do NOT invent legal rules; reason practically and realistically.\n" +
        "- Use only the data present in the similarity report.\n" +
        "- Answer in the same language as the user's input.\n\n" +

        "BRAND REQUESTED:\n" + userBrand + "\n\n" +
        "SIMILARITY REPORT JSON:\n" + reportJsonText + "\n"
      );
    }

    async function callGemini(apiKey, model, prompt, temperature, maxTokens) {
      const url =
        "https://generativelanguage.googleapis.com/v1beta/models/" +
        encodeURIComponent(model) +
        ":generateContent?key=" +
        encodeURIComponent(apiKey);

      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: {
          temperature: Number(temperature),
          maxOutputTokens: Number(maxTokens)
        }
      };

      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const json = await res.json();

      const text =
        json &&
        json.candidates &&
        json.candidates[0] &&
        json.candidates[0].content &&
        json.candidates[0].content.parts
          ? json.candidates[0].content.parts.map(p => p.text || "").join("")
          : "";

      return { text, json };
    }

    function safeNumToPct(n){
      if (typeof n !== "number" || !isFinite(n)) return null;
      return n;
    }

    function buildNoKeySummary(report){
      const best = report && report.best ? report.best : {};
      const nome = typeof best.nome === "string" ? best.nome : "-";
      const comb = safeNumToPct(best.combinada_pct);
      const combTxt = (comb === null) ? "-" : (comb.toFixed(2) + "%");
      return (
        tr("noKeyTitle") + "\n" +
        tr("noKeyBest") + " " + nome + "\n" +
        tr("noKeyScore") + " " + combTxt + "\n\n" +
        tr("noKeyHint")
      );
    }

    async function doCheck(brandText){
      const loading = addMessage(tr("checking"), "bot");

      try{
        const topN = Math.max(1, Math.min(500, Number(topNInput.value) || 50));

        const res = await fetch(CHECK_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ brand: brandText, top_n: topN })
        });

        const raw = await res.text();
        loading.remove();

        let json;
        try {
          json = JSON.parse(raw);
        } catch {
          console.error("Server returned non-JSON:", raw);
          addMessage(tr("badServer"), "bot");
          return;
        }

        if (!json || json.mode !== "ok") {
          // ✅ NÃO DUMPA JSON / DEBUG NO CHAT
          const msg = (json && json.error)
            ? (tr("engineFail") + "\n" + String(json.error))
            : tr("engineFail");
          addMessage(msg, "bot");
          console.warn("Engine non-ok payload:", json);
          return;
        }

        // ✅ reportText fica SÓ INTERNO (vai pro Gemini), não aparece no chat
        const report = json.report || {};
        const reportText = JSON.stringify(report, null, 2);

        // ✅ opcional: debug só no console (não suja UI)
        console.debug("ENGINE_REPORT", report);

        saveOrClearKey();
        const apiKey = apiKeyInput.value.trim();

        if (!apiKey) {
          addMessage(buildNoKeySummary(report), "bot");
          return;
        }

        const loadingGem = addMessage(tr("geminiCalling"), "bot");
        const prompt = buildPromptBrandsDecision(brandText, reportText);

        try{
          const out = await callGemini(apiKey, modelSel.value, prompt, tempInput.value, maxTokensInput.value);
          loadingGem.remove();

          const gem = (out.text || "").trim();
          addMessage(gem ? gem : "⚠️ Gemini retornou resposta vazia.", "bot");
        } catch(e){
          loadingGem.remove();
          addMessage(tr("geminiFail") + String(e), "bot");
          console.error("Gemini error:", e);
        }

      } catch(err){
        loading.remove();
        addMessage(String(err), "bot");
        console.error(err);
      }
    }

    send.onclick = async () => {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";
      await doCheck(text);
    };

    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send.click();
      }
    });

    dbBtn.onclick = () => dbFile.click();
    dbFile.onchange = async () => {
      const file = dbFile.files[0];
      if (!file) return;

      addMessage(tr("dbLoading"), "bot");

      const fd = new FormData();
      fd.append("marcas", file);

      try{
        const res = await fetch(LOAD_DB_ENDPOINT, { method: "POST", body: fd });
        if (!res.ok) throw new Error(await res.text());
        addMessage(tr("dbSuccess"), "bot");
        dbBtn.classList.add("ok");
        setTimeout(() => dbBtn.classList.remove("ok"), 2500);
      } catch(err){
        addMessage(tr("dbError") + String(err), "bot");
      } finally {
        dbFile.value = "";
      }
    };

    toggleKeyBtn.onclick = () => {
      const show = (configRow.style.display === "none");
      configRow.style.display = show ? "flex" : "none";
      if (show) apiKeyInput.focus();
    };

    addMessage(translations[currentLang].welcome, "bot");
    loadKeyFromSession();
    input.focus();
  </script>
</body>
</html>
